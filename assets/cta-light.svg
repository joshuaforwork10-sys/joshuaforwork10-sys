<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Need a revenue system that runs itself? Contact links below."><title>Need a revenue system that runs itself? Contact links below.</title><style>svg{--bg:#FFFFFF;--bg2:#F6F8FB;--card:#FFFFFF;--card2:#EEF2F7;--line:#E2E8F0;--line2:#CBD5E1;--ink:#0B1220;--mut:#475569;--q:#5B6779;--acc:#2457E6;--acct:#1D47C4;--on:#FFFFFF;--glow:rgba(36,87,230,.14);--cy:#0E7490;--vi:#6D28D9;--gr:#047857;--am:#B45309;--okbg:#ECFDF5;--wbg:#FFFBEB}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bgr{fill:var(--bg)} .bg2{fill:var(--bg2)}
.card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .dot,.mover{display:none}}
</style><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--vi)"/></linearGradient><clipPath id="cc"><rect width="1000" height="200" rx="18"/></clipPath></defs><g clip-path="url(#cc)"><rect width="1000" height="200" fill="url(#cg)"/><circle cx="880" cy="100" r="60" fill="none" stroke="#fff" stroke-opacity="0.220"><animate attributeName="r" values="60;130" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.220;0.195" dur="5s" repeatCount="indefinite"/></circle><circle cx="880" cy="100" r="130" fill="none" stroke="#fff" stroke-opacity="0.195"><animate attributeName="r" values="130;200" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.195;0.170" dur="5s" repeatCount="indefinite"/></circle><circle cx="880" cy="100" r="200" fill="none" stroke="#fff" stroke-opacity="0.170"><animate attributeName="r" values="200;270" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.170;0.145" dur="5s" repeatCount="indefinite"/></circle><circle cx="880" cy="100" r="270" fill="none" stroke="#fff" stroke-opacity="0.145"><animate attributeName="r" values="270;340" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.145;0.120" dur="5s" repeatCount="indefinite"/></circle><circle cx="880" cy="100" r="340" fill="none" stroke="#fff" stroke-opacity="0.120"><animate attributeName="r" values="340;410" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.120;0.095" dur="5s" repeatCount="indefinite"/></circle><circle cx="880" cy="100" r="410" fill="none" stroke="#fff" stroke-opacity="0.095"><animate attributeName="r" values="410;480" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.095;0.070" dur="5s" repeatCount="indefinite"/></circle><circle cx="880" cy="100" r="480" fill="none" stroke="#fff" stroke-opacity="0.070"><animate attributeName="r" values="480;550" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.070;0.045" dur="5s" repeatCount="indefinite"/></circle></g><text x="48" y="86" font-size="34" font-weight="650" letter-spacing="-1" style="fill:#fff">Need a revenue system that runs itself?</text><text x="48" y="122" font-size="16" style="fill:#fff;fill-opacity:.85">I scope it, test it on live data, and ship it without breaking what works.</text><text x="48" y="160" font-size="12" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" letter-spacing="1.6" style="fill:#fff;fill-opacity:.75">CONNECT ON LINKEDIN · FULL PORTFOLIO ON REQUEST</text></svg>