E  /  AFTER</text></g><g class="rise" style="animation-delay:0.24s"><rect x="507" y="1" width="237" height="208" rx="14" class="card"/><text x="527" y="34" font-size="14" font-weight="400" text-anchor="start" class="mut" >Workflows needed</text><text x="527" y="53" font-size="14" font-weight="400" text-anchor="start" class="mut" >to run outbound</text><text x="527" y="96" font-size="17" font-weight="400" text-anchor="start" class="q" >56</text><line x1="526" y1="90" x2="547" y2="90" stroke="var(--line2)" stroke-width="1.5"/><text x="527" y="134" font-size="32" font-weight="650" text-anchor="start" class="" letter-spacing="-1">5</text><rect x="527" y="158" width="197" height="7" rx="3.5" fill="var(--line2)" class="grow" style="animation-delay:0.44s"/><rect x="527" y="172" width="17.6" height="7" rx="3.5" fill="var(--acc)" class="grow" style="animation-delay:0.74s"/><text x="527" y="198" font-size="9.5" font-weight="500" text-anchor="start" class="mono q" letter-spacing="1.2">BEFORE  /  AFTER</text></g><g class="rise" style="animation-delay:0.36s"><rect x="760" y="1" width="237" height="208" rx="14" class="card"/><text x="780" y="34" font-size="14" font-weight="400" text-anchor="start" class="mut" >Places a rep looks</text><text x="780" y="53" font-size="14" font-weight="400" text-anchor="start" class="mut" >for a signal</text><text x="780" y="96" font-size="17" font-weight="400" text-anchor="start" class="q" >4 tools</text><line x1="779" y1="90" x2="835" y2="90" stroke="var(--line2)" stroke-width="1.5"/><text x="780" y="134" font-size="32" font-weight="650" text-anchor="start" class="" letter-spacing="-1">1 brief</text><rect x="780" y="158" width="197" height="7" rx="3.5" fill="var(--line2)" class="grow" style="animation-delay:0.56s"/><rect x="780" y="172" width="49.2" height="7" rx="3.5" fill="var(--acc)" class="grow" style="animation-delay:0.86s"/><text x="780" y="198" font-size="9.5" font-weight="500" text-anchor="start" class="mono q" letter-spacing="1.2">BEFORE 