<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Results: demo request to rep 24 hours to 1 minute; automation 3 months to 1 month; outbound workflows 56 to 5; signal sources 4 tools to 1 brief."><title>Results: demo request to rep 24 hours to 1 minute; automation 3 months to 1 month; outbound workflows 56 to 5; signal sources 4 tools to 1 brief.</title><style>svg{--bg:#FFFFFF;--bg2:#F6F8FB;--card:#FFFFFF;--card2:#EEF2F7;--line:#E2E8F0;--line2:#CBD5E1;--ink:#0B1220;--mut:#475569;--q:#5B6779;--acc:#2457E6;--acct:#1D47C4;--on:#FFFFFF;--glow:rgba(36,87,230,.14);--cy:#0E7490;--vi:#6D28D9;--gr:#047857;--am:#B45309;--okbg:#ECFDF5;--wbg:#FFFBEB}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bgr{fill:var(--bg)} .bg2{fill:var(--bg2)}
.card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .dot,.mover{display:none}}
