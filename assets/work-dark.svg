<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="316" viewBox="0 0 1000 316" role="img" aria-label="Selected work: signal-to-rep hub, inbound routing, outbound engines, custom TAM, rep app, attribution engine."><title>Selected work: signal-to-rep hub, inbound routing, outbound engines, custom TAM, rep app, attribution engine.</title><style>svg{--bg:#0D1117;--bg2:#111826;--card:#141C2E;--card2:#1E293B;--line:#1E293B;--line2:#334155;--ink:#F1F5F9;--mut:#A3B0C2;--q:#94A3B8;--acc:#6EA8FF;--acct:#93C0FF;--on:#0A0F1A;--glow:rgba(110,168,255,.18);--cy:#67E8F9;--vi:#C4B5FD;--gr:#6EE7B7;--am:#FCD34D;--okbg:#052E1F;--wbg:#3A2405}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bgr{fill:var(--bg)} .bg2{fill:var(--bg2)}
.card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .dot,.mover{display:none}}
</style><rect x="1.0" y="1" width="323.3" height="150" rx="14" class="card"/><text x="21.0" y="27" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >01</text><circle cx="300.3" cy="23" r="4" class="gr"/><circle cx="300.3" cy="23" r="4" fill="var(--gr)" class="ping"/><text x="21.0" y="55" font-size="17" font-weight="650" text-anchor="start" class="" >Signal-to-rep hub</text><text x="21.0" y="79" font-size="13" font-weight="400" text-anchor="start" class="mut" >Reads every system, scores every account</text><text x="21.0" y="97" font-size="13" font-weight="400" text-anchor="start" class="mut" >nightly, hands each rep a brief.</text><line x1="21.0" y1="113" x2="304.3" y2="113" stroke="var(--line)"/><text x="21.0" y="136" font-size="15" font-weight="650" text-anchor="start" class="" >4 tools → 1 brief</text><rect x="338.3" y="1" width="323.3" height="150" rx="14" class="card"/><text x="358.3333333333333" y="27" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >02</text><circle cx="637.7" cy="23" r="4" class="gr"/><circle cx="637.7" cy="23" r="4" fill="var(--gr)" class="ping"/><text x="358.3333333333333" y="55" font-size="17" font-weight="650" text-anchor="start" class="" >Inbound routing</text><text x="358.3333333333333" y="79" font-size="13" font-weight="400" text-anchor="start" class="mut" >Any lead from any form reaches the right rep</text><text x="358.3333333333333" y="97" font-size="13" font-weight="400" text-anchor="start" class="mut" >with a task and a follow-up.</text><line x1="358.3" y1="113" x2="641.7" y2="113" stroke="var(--line)"/><text x="358.3333333333333" y="136" font-size="15" font-weight="650" text-anchor="start" class="" >24 h → 1 min</text><rect x="675.7" y="1" width="323.3" height="150" rx="14" class="card"/><text x="695.6666666666666" y="27" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >03</text><circle cx="975.0" cy="23" r="4" class="gr"/><circle cx="975.0" cy="23" r="4" fill="var(--gr)" class="ping"/><text x="695.6666666666666" y="55" font-size="17" font-weight="650" text-anchor="start" class="" >Outbound engines</text><text x="695.6666666666666" y="79" font-size="13" font-weight="400" text-anchor="start" class="mut" >A sprawl of workflows rebuilt into a handful of</text><text x="695.6666666666666" y="97" font-size="13" font-weight="400" text-anchor="start" class="mut" >engines inside plan limits.</text><line x1="695.7" y1="113" x2="979.0" y2="113" stroke="var(--line)"/><text x="695.6666666666666" y="136" font-size="15" font-weight="650" text-anchor="start" class="" >56 → 5 workflows</text><rect x="1.0" y="165" width="323.3" height="150" rx="14" class="card"/><text x="21.0" y="191" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >04</text><circle cx="300.3" cy="187" r="4" class="gr"/><circle cx="300.3" cy="187" r="4" fill="var(--gr)" class="ping"/><text x="21.0" y="219" font-size="17" font-weight="650" text-anchor="start" class="" >Custom TAM</text><text x="21.0" y="243" font-size="13" font-weight="400" text-anchor="start" class="mut" >A market database built from public data,</text><text x="21.0" y="261" font-size="13" font-weight="400" text-anchor="start" class="mut" >filings and site scans.</text><line x1="21.0" y1="277" x2="304.3" y2="277" stroke="var(--line)"/><text x="21.0" y="300" font-size="15" font-weight="650" text-anchor="start" class="" >~11k accounts, 1 ID each</text><rect x="338.3" y="165" width="323.3" height="150" rx="14" class="card"/><text x="358.3333333333333" y="191" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >05</text><circle cx="637.7" cy="187" r="4" class="gr"/><circle cx="637.7" cy="187" r="4" fill="var(--gr)" class="ping"/><text x="358.3333333333333" y="219" font-size="17" font-weight="650" text-anchor="start" class="" >Rep app</text><text x="358.3333333333333" y="243" font-size="13" font-weight="400" text-anchor="start" class="mut" >The app reps open before and during calls:</text><text x="358.3333333333333" y="261" font-size="13" font-weight="400" text-anchor="start" class="mut" >battlecards, intel, live signals.</text><line x1="358.3" y1="277" x2="641.7" y2="277" stroke="var(--line)"/><text x="358.3333333333333" y="300" font-size="15" font-weight="650" text-anchor="start" class="" >Live</text><rect x="675.7" y="165" width="323.3" height="150" rx="14" class="card"/><text x="695.6666666666666" y="191" font-size="11" font-weight="600" text-anchor="start" class="mono acct" >06</text><circle cx="975.0" cy="187" r="4" class="gr"/><circle cx="975.0" cy="187" r="4" fill="var(--gr)" class="ping"/><text x="695.6666666666666" y="219" font-size="17" font-weight="650" text-anchor="start" class="" >Attribution engine</text><text x="695.6666666666666" y="243" font-size="13" font-weight="400" text-anchor="start" class="mut" >Ties ads, emails and inbound to the deals</text><text x="695.6666666666666" y="261" font-size="13" font-weight="400" text-anchor="start" class="mut" >they moved; CAC by channel.</text><line x1="695.7" y1="277" x2="979.0" y2="277" stroke="var(--line)"/><text x="695.6666666666666" y="300" font-size="15" font-weight="650" text-anchor="start" class="" >Multi-touch</text></svg>