<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="236" viewBox="0 0 1000 236" role="img" aria-label="What I do: market data, signals and routing, outbound engines, CRM and forecast, AI enablement."><title>What I do: market data, signals and routing, outbound engines, CRM and forecast, AI enablement.</title><style>svg{--bg:#FFFFFF;--bg2:#F6F8FB;--card:#FFFFFF;--card2:#EEF2F7;--line:#E2E8F0;--line2:#CBD5E1;--ink:#0B1220;--mut:#475569;--q:#5B6779;--acc:#2457E6;--acct:#1D47C4;--on:#FFFFFF;--glow:rgba(36,87,230,.14);--cy:#0E7490;--vi:#6D28D9;--gr:#047857;--am:#B45309;--okbg:#ECFDF5;--wbg:#FFFBEB}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bgr{fill:var(--bg)} .bg2{fill:var(--bg2)}
.card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .dot,.mover{display:none}}
</style><rect x="1.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="19.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(39.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-8" rx="10" ry="4"/><path d="M-10 -8v14c0 2.2 4.5 4 10 4s10-1.8 10-4v-14"/><path d="M-10 -1c0 2.2 4.5 4 10 4s10-1.8 10-4"/></g><text x="19.0" y="90" font-size="16" font-weight="650" text-anchor="start" class="" >Market data</text><text x="19.0" y="116" font-size="13" font-weight="400" text-anchor="start" class="mut" >Build the TAM when no</text><text x="19.0" y="135" font-size="13" font-weight="400" text-anchor="start" class="mut" >vendor sells it. Scrape,</text><text x="19.0" y="154" font-size="13" font-weight="400" text-anchor="start" class="mut" >enrich, dedupe, one ID</text><text x="19.0" y="173" font-size="13" font-weight="400" text-anchor="start" class="mut" >per account.</text><rect x="19.0" y="212" width="154.0" height="3" rx="1.5" fill="var(--line)"/><rect x="19.0" y="212" width="53.9" height="3" rx="1.5" fill="var(--acc)"><animate attributeName="x" values="19.0;119.1;19.0" dur="4.0s" repeatCount="indefinite"/></rect><rect x="203.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="221.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(241.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 4c3-9 8-9 11 0s8 9 11 0"/><circle cx="0" cy="0" r="2.4"/><path d="M-6 -10a12 12 0 0 1 12 0M-3 -6a6 6 0 0 1 6 0"/></g><text x="221.0" y="90" font-size="16" font-weight="650" text-anchor="start" class="" >Signals + routing</text><text x="221.0" y="116" font-size="13" font-weight="400" text-anchor="start" class="mut" >Read what accounts do</text><text x="221.0" y="135" font-size="13" font-weight="400" text-anchor="start" class="mut" >in every tool, score</text><text x="221.0" y="154" font-size="13" font-weight="400" text-anchor="start" class="mut" >nightly, route to the right</text><text x="221.0" y="173" font-size="13" font-weight="400" text-anchor="start" class="mut" >person the same day.</text><rect x="221.0" y="212" width="154.0" height="3" rx="1.5" fill="var(--line)"/><rect x="221.0" y="212" width="53.9" height="3" rx="1.5" fill="var(--acc)"><animate attributeName="x" values="221.0;321.1;221.0" dur="4.6s" repeatCount="indefinite"/></rect><rect x="405.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="423.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(443.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-11 -3 11 -11 3 11 0 2z"/><path d="M0 2 11 -11"/></g><text x="423.0" y="90" font-size="16" font-weight="650" text-anchor="start" class="" >Outbound engines</text><text x="423.0" y="116" font-size="13" font-weight="400" text-anchor="start" class="mut" >Sequences, lists and</text><text x="423.0" y="135" font-size="13" font-weight="400" text-anchor="start" class="mut" >deliverability that tell a</text><text x="423.0" y="154" font-size="13" font-weight="400" text-anchor="start" class="mut" >rep who to contact and</text><text x="423.0" y="173" font-size="13" font-weight="400" text-anchor="start" class="mut" >why.</text><rect x="423.0" y="212" width="154.0" height="3" rx="1.5" fill="var(--line)"/><rect x="423.0" y="212" width="53.9" height="3" rx="1.5" fill="var(--acc)"><animate attributeName="x" values="423.0;523.1;423.0" dur="5.2s" repeatCount="indefinite"/></rect><rect x="607.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="625.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(645.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-10" width="22" height="20" rx="3"/><path d="M-11 -3h22M-4 -3v13"/></g><text x="625.0" y="90" font-size="16" font-weight="650" text-anchor="start" class="" >CRM + forecast</text><text x="625.0" y="116" font-size="13" font-weight="400" text-anchor="start" class="mut" >Stages with entry and</text><text x="625.0" y="135" font-size="13" font-weight="400" text-anchor="start" class="mut" >exit gates, so the</text><text x="625.0" y="154" font-size="13" font-weight="400" text-anchor="start" class="mut" >pipeline and the forecast</text><text x="625.0" y="173" font-size="13" font-weight="400" text-anchor="start" class="mut" >mean something.</text><rect x="625.0" y="212" width="154.0" height="3" rx="1.5" fill="var(--line)"/><rect x="625.0" y="212" width="53.9" height="3" rx="1.5" fill="var(--acc)"><animate attributeName="x" values="625.0;725.1;625.0" dur="5.8s" repeatCount="indefinite"/></rect><rect x="809.0" y="1" width="190.0" height="234" rx="14" class="card"/><rect x="827.0" y="20" width="40" height="40" rx="11" fill="var(--acc)" fill-opacity=".12"/><g transform="translate(847.0 40)" fill="none" stroke="var(--acct)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -11l2.6 7.4L10 -1l-7.4 2.6L0 9l-2.6-7.4L-10 -1l7.4-2.6z"/></g><text x="827.0" y="90" font-size="16" font-weight="650" text-anchor="start" class="" >AI enablement</text><text x="827.0" y="116" font-size="13" font-weight="400" text-anchor="start" class="mut" >Agents, skills and a</text><text x="827.0" y="135" font-size="13" font-weight="400" text-anchor="start" class="mut" >company brain, so the</text><text x="827.0" y="154" font-size="13" font-weight="400" text-anchor="start" class="mut" >team runs the same play</text><text x="827.0" y="173" font-size="13" font-weight="400" text-anchor="start" class="mut" >every time.</text><rect x="827.0" y="212" width="154.0" height="3" rx="1.5" fill="var(--line)"/><rect x="827.0" y="212" width="53.9" height="3" rx="1.5" fill="var