<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="How I build: scope, premortem, read-only test on live data, back up, roll out, measure."><title>How I build: scope, premortem, read-only test on live data, back up, roll out, measure.</title><style>svg{--bg:#FFFFFF;--bg2:#F6F8FB;--card:#FFFFFF;--card2:#EEF2F7;--line:#E2E8F0;--line2:#CBD5E1;--ink:#0B1220;--mut:#475569;--q:#5B6779;--acc:#2457E6;--acct:#1D47C4;--on:#FFFFFF;--glow:rgba(36,87,230,.14);--cy:#0E7490;--vi:#6D28D9;--gr:#047857;--am:#B45309;--okbg:#ECFDF5;--wbg:#FFFBEB}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bgr{fill:var(--bg)} .bg2{fill:var(--bg2)}
.card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .dot,.mover{display:none}}
</style><line x1="22" y1="22" x2="865" y2="22" stroke="var(--line2)" stroke-width="2"/><circle r="6" fill="var(--acc)" class="mover"><animateMotion dur="6s" repeatCount="indefinite" path="M22 22 H865"/></circle><g class="rise" style="animation-delay:0.0s"><circle cx="22" cy="22" r="15" fill="var(--card)" stroke="var(--line2)" stroke-width="1.6"/><text x="22.0" y="26" font-size="11" font-weight="600" text-anchor="middle" class="mono q" >01</text><rect x="0" y="52" width="157" height="78" rx="12" class="card"/><text x="16.0" y="84" font-size="15" font-weight="650" text-anchor="start" class="" >Scope</text><text x="16.0" y="106" font-size="13" font-weight="400" text-anchor="start" class="mut" >the one job</text></g><g class="rise" style="animation-delay:0.1s"><circle cx="191" cy="22" r="15" fill="var(--card)" stroke="var(--line2)" stroke-width="1.6"/><text x="190.66666666666666" y="26" font-size="11" font-weight="600" text-anchor="middle" class="mono q" >02</text><rect x="169" y="52" width="157" height="78" rx="12" class="card"/><text x="184.66666666666666" y="84" font-size="15" font-weight="650" text-anchor="start" class="" >Premortem</text><text x="184.66666666666666" y="106" font-size="13" font-weight="400" text-anchor="start" class="mut" >how it breaks</text></g><g class="rise" style="animation-delay:0.2s"><circle cx="359" cy="22" r="15" fill="var(--card)" stroke="var(--line2)" stroke-width="1.6"/><text x="359.3333333333333" y="26" font-size="11" font-weight="600" text-anchor="middle" class="mono q" >03</text><rect x="337" y="52" width="157" height="78" rx="12" class="card"/><text x="353.3333333333333" y="84" font-size="15" font-weight="650" text-anchor="start" class="" >Read-only test</text><text x="353.3333333333333" y="106" font-size="13" font-weight="400" text-anchor="start" class="mut" >on live data</text></g><g class="rise" style="animation-delay:0.30000000000000004s"><circle cx="528" cy="22" r="15" fill="var(--card)" stroke="var(--line2)" stroke-width="1.6"/><text x="528.0" y="26" font-size="11" font-weight="600" text-anchor="middle" class="mono q" >04</text><rect x="506" y="52" width="157" height="78" rx="12" class="card"/><text x="522.0" y="84" font-size="15" font-weight="650" text-anchor="start" class="" >Back up</text><text x="522.0" y="106" font-size="13" font-weight="400" text-anchor="start" class="mut" >before writes</text></g><g class="rise" style="animation-delay:0.4s"><circle cx="697" cy="22" r="15" fill="var(--card)" stroke="var(--line2)" stroke-width="1.6"/><text x="696.6666666666666" y="26" font-size="11" font-weight="600" text-anchor="middle" class="mono q" >05</text><rect x="675" y="52" width="157" height="78" rx="12" class="card"/><text x="690.6666666666666" y="84" font-size="15" font-weight="650" text-anchor="start" class="" >Roll out</text><text x="690.6666666666666" y="106" font-size="13" font-weight="400" text-anchor="start" class="mut" >in batches</text></g><g class="rise" style="animation-delay:0.5s"><circle cx="865" cy="22" r="15" fill="var(--card)" stroke="var(--acc)" stroke-width="1.6"/><text x="865.3333333333333" y="26" font-size="11" font-weight="600" text-anchor="middle" class="mono acct" >06</text><rect x="843" y="52" width="157" height="78" rx="12" class="card"/><text x="859.3333333333333" y="84" font-size="15" font-weight="650" text-anchor="start" class="" >Measure</text><text x="859.3333333333333" y="106" font-size="13" font-weight="400" text-anchor="start" class="mut" >and log it</text></g></svg>