<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="386" viewBox="0 0 1000 386" role="img" aria-label="Career timeline from 2018 to now: recruiting, Veo, Playermaker, SCORE Sports, Coachbetter, with Embrace Sportz concurrent."><title>Career timeline from 2018 to now: recruiting, Veo, Playermaker, SCORE Sports, Coachbetter, with Embrace Sportz concurrent.</title><style>svg{--bg:#0D1117;--bg2:#111826;--card:#141C2E;--card2:#1E293B;--line:#1E293B;--line2:#334155;--ink:#F1F5F9;--mut:#A3B0C2;--q:#94A3B8;--acc:#6EA8FF;--acct:#93C0FF;--on:#0A0F1A;--glow:rgba(110,168,255,.18);--cy:#67E8F9;--vi:#C4B5FD;--gr:#6EE7B7;--am:#FCD34D;--okbg:#052E1F;--wbg:#3A2405}
