<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Josh Robison, GTM Architect and Senior AE. Signals from the CRM, outbound, product and web are scored nightly and become a rep brief by morning."><title>Josh Robison, GTM Architect and Senior AE. Signals from the CRM, outbound, product and web are scored nightly and become a rep brief by morning.</title><style>svg{--bg:#0D1117;--bg2:#111826;--card:#141C2E;--card2:#1E293B;--line:#1E293B;--line2:#334155;--ink:#F1F5F9;--mut:#A3B0C2;--q:#94A3B8;--acc:#6EA8FF;--acct:#93C0FF;--on:#0A0F1A;--glow:rgba(110,168,255,.18);--cy:#67E8F9;--vi:#C4B5FD;--gr:#6EE7B7;--am:#FCD34D;--okbg:#052E1F;--wbg:#3A2405}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.mut{fill:var(--mut)} .q{fill:var(--q)} .acct{fill:var(--acct)} .on{fill:var(--on)} .gr{fill:var(--gr)}
.bgr{fill:var(--bg)} .bg2{fill:var(--bg2)}
.card{fill:var(--card);stroke:var(--line)} .card2{fill:var(--card2);stroke:var(--line2)}
.wire{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.dot{fill:var(--acc)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .dot,.mover{display:none}}
@keyframes t0{0%{opacity:0;transform:translateY(6px)}0.00%{opacity:0;transform:translateY(6px)}2.50%{opacity:1;transform:none}22.50%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.t0{opacity:0;animation:t0 12.8s linear infinite}@keyframes t1{0%{opacity:0;transform:translateY(6px)}25.00%{opacity:0;transform:translateY(6px)}27.50%{opacity:1;transform:none}47.50%{opacity:1;transform:none}50.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.t1{opacity:0;animation:t1 12.8s linear infinite}@keyframes t2{0%{opacity:0;transform:translateY(6px)}50.00%{opacity:0;transform:translateY(6px)}52.50%{opacity:1;transform:none}72.50%{opacity:1;transform:none}75.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.t2{opacity:0;animation:t2 12.8s linear infinite}@keyframes t3{0%{opacity:0;transform:translateY(6px)}75.00%{opacity:0;transform:translateY(6px)}77.50%{opacity:1;transform:none}97.50%{opacity:1;transform:none}100.00%{opacity:0;transform:translateY(-6px)}100%{opacity:0}}.t3{opacity:0;animation:t3 12.8s linear infinite}@media (prefers-reduced-motion:reduce){.t0{opacity:1}}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--line)" stroke-width="1"/></pattern><radialGradient id="m" cx="72%" cy="40%" r="60%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="mk"><rect width="1000" height="340" fill="url(#m)"/></mask><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="var(--acc)" stop-opacity=".22"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></radialGradient><clipPath id="clip"><rect width="1000" height="340" rx="18"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1000" height="340" class="bg2"/><rect width="1000" height="340" fill="url(#g)" mask="url(#mk)" opacity=".9"/><circle cx="800" cy="150" r="260" fill="url(#glow)"/></g><rect x=".5" y=".5" width="999" height="339" rx="18" fill="none" stroke="var(--line)"/><g class="rise"><circle cx="52" cy="62" r="5" class="dot"/><circle cx="52" cy="62" r="5" class="dot ping"/><text x="66" y="67" font-size="13" font-weight="500" text-anchor="start" class="mono q" letter-spacing="2.4">JOSH ROBISON</text><text x="44" y="128" font-size="50" font-weight="600" text-anchor="start" class="" letter-spacing="-1.6">GTM Architect</text><text x="44" y="184" font-size="50" font-weight="600" letter-spacing="-1.6"><tspan class="acct">and</tspan> Senior AE</text><text x="46" y="222" font-size="16" font-weight="400" text-anchor="start" class="mut" >I build the revenue system, then I sell on it:</text><text x="46" y="244" font-size="16" font-weight="400" text-anchor="start" class="mut" >data, signals, outbound, CRM and AI, wired as one.</text></g><rect x="44" y="270" width="420" height="38" rx="10" class="card"/><rect x="58" y="282" width="46" height="14" rx="7" fill="var(--okbg)"/><circle cx="66" cy="289" r="3" class="gr"/><text x="73" y="293" font-size="9.5" font-weight="600" text-anchor="start" class="mono gr" letter-spacing="1">LIVE</text><text x="114" y="294" font-size="13.5" font-weight="500" text-anchor="start" class="t0" >Inbound lead to a rep: 24 hours → 1 minute</text><text x="114" y="294" font-size="13.5" font-weight="500" text-anchor="start" class="t1" >Outbound automation: 56 workflows → 5</text><text x="114" y="294" font-size="13.5" font-weight="500" text-anchor="start" class="t2" >A TAM built where no vendor had the data</text><text x="114" y="294" font-size="13.5" font-weight="500" text-anchor="start" class="t3" >Every account scored nightly, briefed by morning</text><rect x="560" y="53" width="118" height="34" rx="9" class="card2"/><text x="619" y="75" font-size="13" font-weight="500" text-anchor="middle" class="" >CRM</text><rect x="560" y="109" width="118" height="34" rx="9" class="card2"/><text x="619" y="131" font-size="13" font-weight="500" text-anchor="middle" class="" >Outbound</text><rect x="560" y="165" width="118" height="34" rx="9" class="card2"/><text x="619" y="187" font-size="13" font-weight="500" text-anchor="middle" class="" >Product</text><rect x="560" y="221" width="118" height="34" rx="9" class="card2"/><text x="619" y="243" font-size="13" font-weight="500" text-anchor="middle" class="" >Web + ads</text><path d="M678 70 C 730 70, 720 168, 744 168" class="wire"/><path d="M678 126 C 730 126, 720 168, 744 168" class="wire"/><path d="M678 182 C 730 182, 720 168, 744 168" class="wire"/><path d="M678 238 C 730 238, 720 168, 744 168" class="wire"/><path d="M836 168 L 868 168" class="wire"/><circle cx="790" cy="168" r="46" fill="var(--acc)" opacity=".18" class="ping"/><circle cx="790" cy="168" r="46" fill="var(--acc)"/><text x="790" y="165" font-size="13" font-weight="600" text-anchor="middle" class="on" >Nightly</text><text x="790" y="182" font-size="13" font-weight="600" text-anchor="middle" class="on" >score</text><rect x="868" y="146" width="104" height="44" rx="10" fill="var(--card)" stroke="var(--acc)" stroke-width="1.6"/><text x="920" y="167" font-size="13" font-weight="600" text-anchor="middle" class="" >Rep brief</text><text x="920" y="182" font-size="10.5" font-weight="400" text-anchor="middle" class="mono q" >by morning</text><text x="920" y="212" font-size="11.5" font-weight="400" text-anchor="middle" class="mut" >who to call,</text><text x="920" y="227" font-size="11.5" font-weight="400" text-anchor="middle" class="mut" >and why</text><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-0.01s" repeatCount="indefinite" path="M678 70 C 730 70, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-1.31s" repeatCount="indefinite" path="M678 70 C 730 70, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-0.46s" repeatCount="indefinite" path="M678 126 C 730 126, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-1.76s" repeatCount="indefinite" path="M678 126 C 730 126, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-0.91s" repeatCount="indefinite" path="M678 182 C 730 182, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-2.21s" repeatCount="indefinite" path="M678 182 C 730 182, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-1.36s" repeatCount="indefinite" path="M678 238 C 730 238, 720 168, 744 168"/></circle><circle r="4" class="dot mover"><animateMotion dur="2.6s" begin="-2.66s" repeatCount="indefinite" path="M678 238 C 730 238, 720 168, 744 168"/></circle><circle r="4.5" fill="var(--gr)" class="mover"><animateMotion dur="1.3s" begin="-0.4s" repeatCount="indefinite" path="M836 168 L 868 168"/></circle><text x="560" y="296" font-size="10" font-weight="500" text-anchor="start" class="mono q" letter-spacing="1.4">SIGNALS IN</text><text x="790" y="296" font-size="10" font-weight="500" text-anchor="middle" class="mono q" letter-spacing="1.4">DECIDE</text><text x="920" y="296" font-size="10" font-weight="500" text-anchor="middle" class="mono q" letter-spacing="1.4">ACT</text></svg>