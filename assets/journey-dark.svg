le" class="mut" >territory</text><path d="M421 24.0 L448 51.0 L421 78.0 L394 51.0 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="1.4"/><text x="421" y="55.0" font-size="11.5" font-weight="600" text-anchor="middle" class="" >Tier 1?</text><text x="455" y="42.0" font-size="11" font-weight="600" text-anchor="start" class="acct" >No</text><text x="429" y="97.0" font-size="11" font-weight="600" text-anchor="start" class="gr" >Yes</text><rect x="491.0" y="101.0" width="106" height="48" rx="10" class="card2"/><text x="544" y="122.0" font-size="12" font-weight="600" text-anchor="middle" class="" >State drip,</text><text x="544" y="138.0" font-size="11" font-weight="400" text-anchor="middle" class="mut" >one per club</text><rect x="614.0" y="175.0" width="106" height="48" rx="10" class="card2"/><text x="667" y="196.0" font-size="12" font-weight="600" text-anchor="middle" class="" >Signals scored</text><text x="667" y="212.0" font-size="11" font-weight="400" text-anchor="middle" class="mut" >every night</text><rect x="737.0" y="249.0" width="106" height="48" rx="10" class="card2"/><text x="790" y="270.0" font-size="12" font-weight="600" text-anchor="middle" class="" >Called first,</text><text x="790" y="286.0" font-size="11" font-weight="400" text-anchor="middle" class="mut" >qualified</text><rect x="491.0" y="323.0" width="106" height="48" rx="10" class="card2"/><text x="544" y="344.0" font-size="12" font-weight="600" text-anchor="middle" class="" >Warm intro or</text><text x="544" y="360.0" font-size="11" font-weight="400" text-anchor="middle" class="mut" >national event</text><rect x="860.0" y="175.0" width="106" height="48" rx="24" class="card2" stroke-dasharray="4 4"/><text x="913" y="196.0" font-size="12" font-weight="600" text-anchor="middle" class="" >Inbound demo</text><text x="913" y="212.0" font-size="11" font-weight="400" text-anchor="middle" class="mut" >routed in 1 min</text><rect x="860.0" y="323.0" width="106" height="48" rx="10" fill="var(--acc)"/><text x="913" y="344.0" font-size="12" font-weight="600" text-anchor="middle" class="on" >Gated deal</text><text x="913" y="360.0" font-size="11" font-weight="400" text-anchor="middle" class="on" >to closed-won</text><circle r="6" fill="var(--acc)" class="mover"><animateMotion dur="9s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear" path="M175 51.0 H544 V125.0 H667 V199.0 H790 V273.0 H913 V347.0"/></circle><circle r="6" fill="var(--gr)" class="mover"><animateMotion dur="6s" begin="1.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear" path="M175 51.0 H421 V347.0 H913"/></circle><circle r="6" fill="var(--vi)" class="mover"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear" path="M913 199.0 V347.0"/></circle><circle cx="21" cy="406" r="5" fill="var(--acc)"/><text x="32" y="410" font-size="12.5" font-weight="400" text-anchor="start" class="mut" >Outbound, Tier 2–4: drip, signal, BDR call</text><circle cx="292.00000000000006" cy="406" r="5" fill="var(--gr)"/><text x="303.00000000000006" y="410" font-size="12.5" font-weight="400" text-anchor="start" class="mut" >Outbound, Tier 1: warm path, AE on the trip</text><circle cx="574.5" cy="406" r="5" fill="var(--vi)"/><text x="585.5" y="410" font-size="12.5" font-weight="400" text-anchor="start" class="mut" >Inbound: straight to the right AE</text></svg>