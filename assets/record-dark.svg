<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="118" viewBox="0 0 1000 118" role="img" aria-label="Selling record: 120% of new-business quota; $1.4M revenue created, number 2 on the team; 43% enterprise win rate; plus 150% quarterly revenue."><title>Selling record: 120% of new-business quota; $1.4M revenue created, number 2 on the team; 43% enterprise win rate; plus 150% quarterly revenue.</title><style>svg{--bg:#0D1117;--bg2:#111826;--card:#141C2E;--card2:#1E293B;--line:#1E293B;--line2:#334155;--ink:#F1F5F9;--mut:#A3B0C2;--q:#94A3B8;--acc:#6EA8FF;--acct:#93C0FF;--on:#0A0F1A;--glow:rgba(110,168,255,.18);--cy:#67E8F9;--vi:#C4B5FD;--gr:#6EE7B7;--am:#FCD34D;--okbg:#052E1F;--wbg:#3A2405}
